name: Build & Release to GitCode

# 双平台 CI 提速优化验证中（Dev Drive + rust-lld + Defender + CARGO_INCREMENTAL=0）。

# ─────────────────────────────────────────────────────────────
# 方案1（修正版）：GitHub 公有 runner 编译 Win/macOS 包，
# 产物回传到 GitCode Release，国内用户在 gitcode.com 下载。
#
# 与 tauri 官方模板的关键差异：
#   1. tauri-action 不传 tagName/releaseName → 只产出 artifact，不在 tauri-action 内建 Release
#      （Release 由后面的 gh release create / GitCode API 步骤独立建）
#   2. 双 Release 发布：GitHub Release（公开仓免费不限速，备份源）+ GitCode Release（国内镜像）
#   3. 纯 curl 调 GitCode API（零第三方 action 依赖），根治：
#      - secrets 块必须与 with 同级（不是嵌套）
#      - bash globstar 问题（自己用 find 递归）
#      - 失败时能看到完整响应体
#   4. PDFium 动态库已入库，CI 无需下载步骤
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch: # 手动触发（测试流水线用）
  push:
    # 打 tag 触发正式发版（含 GitCode Release 同步）
    tags: ["v*"]
    # push 到 main 只做 build + 缓存预热，不发版
    # 关键：让 main 分支保存 Rust cache，后续 tag 触发的 run 能命中
    # （GitHub Actions cache 按 ref 隔离，tag run 能读 main 的 cache，
    # 但不同 tag 之间互相读不到；必须有 main 的 cache 供 tag 复用）
    branches: [main]
    paths-ignore: # 这些路径变更不影响构建，跳过省 CI 时间
      - "docs/**"
      - "*.md"
      - "scripts/init-standalone-repo.sh"

permissions:
  contents: write # 需写权限：在 GitHub 建 Release（原来只读因不发版）

env:
  # GitCode 仓库路径（owner/repo）
  GITCODE_REPO: "JasonSmiths/ontology-studio"
  # GitCode API base
  GITCODE_API: "https://api.gitcode.com/api/v5"

jobs:
  # ═══════════════════════════════════════════════════════════
  # Job 1: 两平台并行编译，产物上传为 GitHub Artifact
  # ═══════════════════════════════════════════════════════════
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 单平台失败不影响其他平台继续
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-14 # Apple Silicon runner
            target: aarch64-apple-darwin
            label: macos-arm64
          # macos-x64 (Intel) 已移除：GitHub macos-15-intel runner 硬件性能约为
          # M1 的 50-60%，Rust 编译耗时翻倍（46m vs 20m）。Intel mac 用户可
          # 通过 Rosetta 运行 arm64 包，或后续按需重新启用。
    steps:
      - uses: actions/checkout@v5

      # ── Rust 编译优化（双平台通用） ──
      # CARGO_INCREMENTAL=0：CI 是 from-scratch 全量编译，incremental 的簿记开销
      # 反而拖慢（corrode.dev 实测建议）。profile.release 里的 incremental=true
      # 只对本地开发有用，CI 里用 env var 覆盖关闭。
      # CARGO_NET_RETRY/CARGO_NET_FETCH_TIMEOUT： crates.io 网络增强鲁棒。
      - name: Set Rust env
        run: |
          echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
          echo "CARGO_NET_RETRY=5" >> $GITHUB_ENV
          echo "CARGO_NET_FETCH_TIMEOUT=120" >> $GITHUB_ENV

      # ── Windows CI 提速三件套（Dev Drive + Defender 排除 + rust-lld） ──
      # 综合预期提速：13m → 8-9m（-35%~40%）。仅 Windows job 生效。
      #
      # 1. Dev Drive（ReFS）：samypr100/setup-dev-drive 创建 VHDX，IO 密集型工作负载
      #    提速 25%+。C: drive IOPS ~4.3k vs Dev Drive ~124k（29×）。重定向
      #    CARGO_HOME/RUSTUP_HOME/TEMP/TMP + CARGO_TARGET_DIR 到 Dev Drive。
      #    必须在 Rust toolchain 安装前创建，让 CARGO_HOME 一开始在快盘。
      # 2. Defender 排除：排除 workspace + Dev Drive。Rust 编译产生海量 .rlib/.rmeta，
      #    Defender 实时扫描是 IO 杀手（flow PR #2908 实测省 ~8%）。
      #
      # ⚠️ rust-lld 已移除：实测在含 PDFium 原生库的 Tauri 项目上，rust-lld
      #    链接阶段卡死/超慢（20min+ Build Tauri 未完成，远超 link.exe 正常耗时）。
      #    非环境问题（Defender 已排除），是 rust-lld 对大型原生静态库的兼容问题。
      #    保留 link.exe，依赖 Dev Drive + Defender 提速 IO。
      - name: Setup Windows Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          # drive-size 默认 2GB 太小，Rust registry（593 crate 解压 ~4GB）+
          # target/ 编译产物 ~5GB + RUSTUP_HOME ~1GB，至少需 12GB。
          # public runner 约 15GB 可用，设 14GB Dynamic（按需扩展，不预占）。
          drive-size: 14GB
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
            TEMP,{{ DEV_DRIVE }}/Temp
            TMP,{{ DEV_DRIVE }}/Temp

      - name: Optimize Windows build (Defender exclusion)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          if ($env:DEV_DRIVE) {
            Add-MpPreference -ExclusionPath "$env:DEV_DRIVE"
            # 验证 Dev Drive 环境变量已设
            Write-Host "DEV_DRIVE=$env:DEV_DRIVE"
            Write-Host "CARGO_HOME=$env:CARGO_HOME"
            Write-Host "CARGO_TARGET_DIR=$env:CARGO_TARGET_DIR"
          }

      # ── macOS 提速：TEMP 重定向到 /tmp（APFS 已快，仅避免污染 home） ──
      # macOS 不配 rust-lld：Darwin target 用 lld 需 -Z unstable 选项，社区反馈
      # 不稳定且 mac 默认 ld64 已不错，风险高于收益。只做纯收益的 TEMP 重定向。
      - name: Optimize macOS build
        if: runner.os == 'macOS'
        run: |
          echo "TMPDIR=/tmp" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Rust 编译缓存（swatinem/rust-cache）
      # Windows: CARGO_TARGET_DIR=Dev Drive/target（绝对路径，swatinem 需显式 workspaces）
      # macOS: 仓库根 target/（默认）
      # cache key：平台 target，shared-key 用 Cargo.lock hash 保证依赖变动时仍命中。
      - name: Rust cache (Windows)
        if: runner.os == 'Windows'
        uses: swatinem/rust-cache@v2
        with:
          # CARGO_TARGET_DIR 被 Dev Drive 重定向到绝对路径，swatinem 需显式指定
          workspaces: ${{ env.CARGO_TARGET_DIR }}
          key: ${{ matrix.target }}
          shared-key: ${{ hashFiles('**/Cargo.lock') }}

      - name: Rust cache (macOS)
        if: runner.os == 'macOS'
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          shared-key: ${{ hashFiles('**/Cargo.lock') }}

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm # 加速 npm ci，缓存 ~/.npm

      - name: Install npm deps
        run: npm ci

      # PDFium 动态库已入库（src-tauri/resources/pdfium/{win-x64,mac-arm64}/），
      # 无需 CI 下载。版本固定 chromium/7881，升级时手动替换 + 改 scripts/fetch-pdfium.sh。
      # 详见 docs/RELEASE-GUIDE.md「PDFium 版本管理」。

      # tauri-action 纯构建模式：不传 tagName/releaseName/releaseDraft，
      # 只 build + 输出本地产物，不碰 GitHub Release
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      # 把构建出的安装包上传为 artifact（命名按平台区分，便于聚合下载）
      # 产物路径：Windows 在 Dev Drive/target/，mac 在仓库根 target/。
      # src-tauri/target/ 作兜底 glob（tauri-action 可能用独立 target）。
      - name: Upload build artifacts (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.label }}
          if-no-files-found: error # 产物缺失直接失败，避免空 Release
          path: |
            ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle/nsis/*.exe
            ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

      - name: Upload build artifacts (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.label }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  # ═══════════════════════════════════════════════════════════
  # Job 2: 两平台都成功后，聚合 artifact → 创建 GitCode Release → 上传附件
  # ═══════════════════════════════════════════════════════════
  sync_gitcode_release:
    name: Sync Release to GitCode
    needs: build
    # 只在 tag 触发时同步 GitCode Release；main 分支 push 只做 build 预热 cache，不发版
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: ./assets
          merge-multiple: true # 合并到同一目录（两平台产物名不同，无覆盖）

      - name: List downloaded files
        run: find ./assets -type f | sort

      # ── 发布 GitHub Release（作为 GitCode 的备份源 + 代理用户直连下载）──
      # 公开仓库 GitHub Release 存储免费、不限速。用内置 GITHUB_TOKEN，零配置。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }} # owner/repo，传给 --repo 避免 gh 依赖本地 git
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 收集所有安装包
          mapfile -t ASSETS < <(find ./assets -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
            -o -name '*.AppImage' -o -name '*.deb' \) | sort)
          echo "上传到 GitHub Release: ${#ASSETS[@]} 个文件"
          # --repo 显式指定仓库（sync job 没 checkout，没有本地 .git，gh 会调 git 报错）
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，追加资产"
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --draft=false \
              --notes "Ontology Studio $TAG

          ## 下载
          - **macOS (Apple Silicon)**: \`.dmg\`
          - **Windows x64**: \`.exe\` (NSIS) 或 \`.msi\`
          - 国内用户如下载慢，请到 [GitCode Release](https://gitcode.com/JasonSmiths/ontology-studio/releases) 镜像下载

          ## macOS 安装提示
          DMG 未签名，首次打开请右键 → 打开。"
          fi
          # 上传所有资产到 GitHub Release
          for f in "${ASSETS[@]}"; do
            echo "上传 $(basename "$f")..."
            gh release upload "$TAG" "$f" --repo "$REPO" --clobber
          done
          echo "✅ GitHub Release $TAG 发布完成"

      # ── 创建/更新 GitCode Release ──
      # 同上，GitCode API 偶发 502，不阻塞发版。
      - name: Create or Update GitCode Release
        continue-on-error: true
        id: gc_release
        env:
          TOKEN: ${{ secrets.GITCODE_TOKEN }}
          REPO: ${{ env.GITCODE_REPO }}
          API: ${{ env.GITCODE_API }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 先查 Release 是否已存在（按 tag）
          HTTP=$(curl -L -sS -o /tmp/check.json -w "%{http_code}" \
            -H "PRIVATE-TOKEN: $TOKEN" \
            -H "Accept: application/json" \
            "$API/repos/$REPO/releases/tags/$TAG")
          if [ "$HTTP" = "200" ]; then
            echo "Release 已存在，走 UPDATE"
            METHOD="PATCH"
            URL="$API/repos/$REPO/releases/$TAG"
          elif [ "$HTTP" = "404" ]; then
            echo "Release 不存在，走 CREATE"
            METHOD="POST"
            URL="$API/repos/$REPO/releases"
          else
            echo "❌ 查询 Release 失败 HTTP=$HTTP"
            cat /tmp/check.json
            exit 1
          fi

          BODY="自动构建发布 $TAG，包含 Windows (x64) / macOS (arm64) 安装包。由 GitHub Actions 构建。"
          HTTP=$(curl -L -sS -o /tmp/rel.json -w "%{http_code}" \
            -X "$METHOD" \
            -H "PRIVATE-TOKEN: $TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$(jq -nc --arg tag "$TAG" --arg body "$BODY" \
              '{tag_name:$tag, name:$tag, body:$body, release_status:"latest"}')" \
            "$URL")
          if [ "$HTTP" = "200" ]; then
            echo "✅ Release $METHOD 成功"
          else
            echo "❌ Release $METHOD 失败 HTTP=$HTTP"
            cat /tmp/rel.json
            exit 1
          fi

      # ── 上传安装包到 GitCode Release（两步式预签名 OSS 直传） ──
      # GitCode 是国内镜像，其 OSS 直传偶发 502 Bad Gateway（70MB 大文件尤甚）。
      # 这是外部服务故障，不应阻塞发版——GitHub Release（主分发渠道）已发布
      # 即算发版成功。GitCode 失败仅警告，下次 push tag 可重试补传。
      - name: Upload assets to GitCode Release
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITCODE_TOKEN }}
          REPO: ${{ env.GITCODE_REPO }}
          API: ${{ env.GITCODE_API }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 用 find 递归收集所有安装包（根治 bash globstar 不跨目录问题）
          mapfile -t FILES < <(find ./assets -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
            -o -name '*.AppImage' -o -name '*.deb' \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "❌ 没找到任何安装包，终止"
            exit 1
          fi
          echo "待上传文件数: ${#FILES[@]}"

          upload_one() {
            local f="$1" idx="$2" total="$3"
            local fname="$(basename "$f")"
            echo "[$idx/$total] ── 上传 $fname ($(du -m "$f" | cut -f1)MB) ──"
            # 步骤1: GET upload_url 拿预签名地址 + headers
            # 用 --get --data-urlencode 让 curl 自动 URL-encode 文件名（含空格，
            # 如 "Ontology Studio_0.1.0_aarch64.dmg"），根治 Malformed URL 错误。
            local INFO UPLOAD_URL
            INFO=$(curl -sS --get \
              --data-urlencode "file_name=$fname" \
              -H "PRIVATE-TOKEN: $TOKEN" \
              -H "Accept: application/json" \
              "$API/repos/$REPO/releases/$TAG/upload_url")
            UPLOAD_URL=$(echo "$INFO" | jq -r '.url')
            if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
              echo "❌ [$idx/$total] $fname 拿不到 upload_url："
              echo "$INFO"
              return 1
            fi
            # 构造 headers 数组（GitCode 返回 {headers:{k:v,...}}）
            local -a HDR_ARGS=()
            while IFS= read -r line; do
              [ -n "$line" ] && HDR_ARGS+=(-H "$line")
            done < <(echo "$INFO" | jq -r '.headers // {} | to_entries[] | "\(.key): \(.value)"')

            # 步骤2: PUT 二进制到预签名地址
            local HTTP
            HTTP=$(curl -X PUT -sS -o /tmp/up_$idx.json -w "%{http_code}" \
              --retry 3 --retry-delay 5 \
              "${HDR_ARGS[@]}" \
              -T "$f" \
              "$UPLOAD_URL")
            if [ "$HTTP" = "200" ]; then
              echo "  ✅ [$idx/$total] $fname 上传成功"
            else
              echo "  ❌ [$idx/$total] $fname 上传失败 HTTP=$HTTP"
              cat /tmp/up_$idx.json
              return 1
            fi
          }
          export -f upload_one
          export TOKEN REPO API TAG

          # 并行上传（所有文件同时 PUT，跨境带宽是瓶颈，并行能显著加速）
          total=${#FILES[@]}
          pids=()
          i=0
          for f in "${FILES[@]}"; do
            i=$((i+1))
            upload_one "$f" "$i" "$total" &
            pids+=($!)
          done

          # 等待所有上传，任一失败则整体失败
          fail=0
          for pid in "${pids[@]}"; do
            wait "$pid" || fail=1
          done
          if [ "$fail" = "1" ]; then
            echo "❌ 有文件上传失败"
            exit 1
          fi
          echo "🎉 全部上传完成"
          echo "🎉 全部上传完成"

      - name: Summary
        if: always()
        env:
          GC_RESULT: ${{ steps.gc_release.outcome }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "### Release $TAG 发版结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ GitHub Release（主下载渠道）：https://github.com/${{ github.repository }}/releases/tag/$TAG" >> $GITHUB_STEP_SUMMARY
          if [ "$GC_RESULT" = "success" ]; then
            echo "✅ GitCode 镜像：https://gitcode.com/${{ env.GITCODE_REPO }}/releases/$TAG" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ GitCode 镜像同步失败（$GC_RESULT），国内用户可走 GitHub Release 或后续重试补传" >> $GITHUB_STEP_SUMMARY
          fi

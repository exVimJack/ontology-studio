# Cargo 本地配置
#
# 原为 Windows 环境配置（target-dir 指向 C:/Users/think/AppData/Local/...，
# 规避 WDAC/Smart App Control）。同步到 macOS 后该 Windows 路径会导致
# cargo join fallback library path 时把 `:` 当分隔符而报错
# ("path segment contains separator `:`")，故改为 macOS 本地路径。
#
# 切回 Windows 时需恢复为：
#   target-dir = "C:/Users/think/AppData/Local/onto-studio-target"
[build]
target-dir = "target"

# Windows MSVC 用 rust-lld（self-contained linker）替代 link.exe。
# Rust release 产物体积大（含 Tauri/pdfium/datafusion），MSVC link.exe 链接
# 阶段极慢；rust-lld 随 Rust toolchain 发布（需 llvm-tools 组件），大产物
# 链接提速 2-3×。仅 Windows target 生效，macOS/Linux 不受影响。
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
linker-flavor = "lld-link"

<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{THEME}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
/* ── 主题 token（与应用 styles.css 同源，浅/深/auto 三态） ──
   auto：跟随查看者系统（@media prefers-color-scheme）
   light/dark：html 加 .theme-light / .theme-dark class 强制
   不再收集页面 CSS——避免带入 overflow:hidden / 流式光标 / 选不中的工具类。 */
:root {
  --bg: #ffffff;
  --bg-elevated: #f9fafb;
  --bg-hover: #f3f4f6;
  --border: #e5e7eb;
  --fg: #111827;
  --fg-muted: #6b7280;
  --fg-subtle: #9ca3af;
  --accent: #2563eb;
  --accent-fg: #ffffff;
  --danger: #ef4444;
  --danger-fg: #ffffff;
  --radius: 10px;
  --export-avatar: 28px;
  --export-max-bubble: 85%;
}
@media (prefers-color-scheme: dark) {
  :root:not(.theme-light) {
    --bg: #0f1115;
    --bg-elevated: #171a21;
    --bg-hover: #1f242d;
    --border: #2a2f3a;
    --fg: #e5e7eb;
    --fg-muted: #9ca3af;
    --fg-subtle: #6b7280;
    --accent: #3b82f6;
    --accent-fg: #ffffff;
    --danger: #f87171;
    --danger-fg: #1f1010;
  }
}
.theme-dark {
  --bg: #0f1115;
  --bg-elevated: #171a21;
  --bg-hover: #1f242d;
  --border: #2a2f3a;
  --fg: #e5e7eb;
  --fg-muted: #9ca3af;
  --fg-subtle: #6b7280;
  --accent: #3b82f6;
  --accent-fg: #ffffff;
  --danger: #f87171;
  --danger-fg: #1f1010;
}

/* ── 基础 ── */
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  /* 导出页是长文档，必须可滚动（覆盖任何残留的 overflow:hidden） */
  overflow: auto;
  height: auto;
}
.export-shell {
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 20px 64px;
}

/* ── 页头 ── */
.export-header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
  margin-bottom: 8px;
}
.export-header h1 {
  margin: 0 0 4px;
  font-size: 18px;
  font-weight: 600;
  color: var(--fg);
}
.export-header .export-sub {
  font-size: 12px;
  color: var(--fg-muted);
}

/* ── 消息流 / 气泡 / 头像（复刻 Thread.tsx 视觉） ── */
.export-messages { display: flex; flex-direction: column; }
.msg { display: flex; gap: 12px; padding: 12px 0; }
.msg.user { flex-direction: row-reverse; }
.avatar {
  flex: 0 0 auto;
  width: var(--export-avatar);
  height: var(--export-avatar);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.user-avatar { background: var(--bg-hover); color: var(--fg); }
.assistant-avatar {
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  color: var(--accent);
}
.bubble-wrap {
  display: flex;
  flex-direction: column;
  min-width: 0;
  max-width: var(--export-max-bubble);
  gap: 4px;
}
.user-wrap { align-items: flex-end; }
.assistant-wrap { align-items: flex-start; }
.bubble {
  min-width: 0;
  overflow: hidden;
  border-radius: var(--radius);
  padding: 10px 14px;
  word-break: break-word;
}
.user-bubble {
  background: var(--accent);
  color: var(--accent-fg);
  white-space: pre-line;
}
.assistant-bubble { background: var(--bg-elevated); color: var(--fg); }
.meta { font-size: 11px; color: var(--fg-subtle); }

/* ── aui-md 排版（选 micromark 生成的裸标签，复刻 MarkdownText.tsx 的间距值） ──
   应用内这些是写在 React 组件 className 上的 Tailwind 工具类，
   导出 HTML 里 micromark 产出无 class 的裸标签，故用标签选择器复刻。 */
.aui-md { font-size: 13px; }
.aui-md > :first-child { margin-top: 0; }
.aui-md > :last-child { margin-bottom: 0; }
.aui-md h1 { margin: 1.25rem 0 0.5rem; font-size: 1.25rem; font-weight: 600; line-height: 1.4; }
.aui-md h2 { margin: 1.25rem 0 0.5rem; font-size: 1.125rem; font-weight: 600; line-height: 1.4; }
.aui-md h3 { margin: 1rem 0 0.375rem; font-size: 1rem; font-weight: 600; line-height: 1.4; }
.aui-md h4 { margin: 0.875rem 0 0.25rem; font-size: 1rem; font-weight: 500; }
.aui-md h5 { margin: 0.75rem 0 0.25rem; font-size: 0.875rem; font-weight: 600; }
.aui-md h6 { margin: 0.75rem 0 0.25rem; font-size: 0.875rem; font-weight: 500; }
.aui-md p { margin: 0.75rem 0; line-height: 1.625; overflow-wrap: anywhere; }
.aui-md ul, .aui-md ol { margin: 0.75rem 0; padding-left: 1.25rem; }
.aui-md ul { list-style: disc; }
.aui-md ol { list-style: decimal; }
.aui-md li { margin-top: 0.25rem; line-height: 1.625; overflow-wrap: anywhere; }
.aui-md li > input[type="checkbox"] { margin-right: 0.4em; }
.aui-md blockquote {
  margin: 0.75rem 0;
  border-left: 2px solid var(--border);
  padding-left: 1rem;
  color: var(--fg-muted);
}
.aui-md hr { margin: 0.75rem 0; border: none; border-top: 1px solid var(--border); }
.aui-md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.aui-md strong { font-weight: 600; }
.aui-md code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.85em;
  background: var(--bg-hover);
  padding: 0.1em 0.35em;
  border-radius: 0.25rem;
  overflow-wrap: anywhere;
}
.aui-md pre {
  margin: 0.75rem 0 0;
  overflow-x: auto;
  border: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
  border-top: 0;
  border-radius: 0 0 0.75rem 0.75rem;
  background: color-mix(in srgb, var(--bg-hover) 30%, transparent);
  padding: 0.875rem 0.875rem;
  font-size: 13px;
  line-height: 1.625;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.aui-md pre code {
  background: none;
  padding: 0;
  border-radius: 0;
  font-size: inherit;
  white-space: pre-wrap;
}
.aui-md table {
  margin: 0.75rem 0;
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.875rem;
  display: block;
  overflow-x: auto;
}
.aui-md th {
  background: var(--bg-hover);
  padding: 0.375rem 0.75rem;
  font-weight: 500;
  text-align: left;
}
.aui-md td {
  padding: 0.375rem 0.75rem;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
  border-right: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
}
.aui-md td:last-child, .aui-md th:last-child { border-right: 0; }
.aui-md tr:last-child td { border-bottom: 0; }
.aui-md tr:first-child th:first-child { border-top-left-radius: 0.5rem; }
.aui-md tr:first-child th:last-child { border-top-right-radius: 0.5rem; }
.aui-md tr:last-child td:first-child { border-bottom-left-radius: 0.5rem; }
.aui-md tr:last-child td:last-child { border-bottom-right-radius: 0.5rem; }

/* citation 上标（[n] 复刻应用 CitationMark） */
.cite {
  display: inline-block;
  margin-left: 1px;
  padding: 0 4px;
  border-radius: 4px;
  font-size: 0.7em;
  font-weight: 500;
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  color: var(--accent);
  vertical-align: super;
  line-height: 1;
}

/* reasoning 折叠块（复刻 Thread 的 Reasoning 组件） */
.reasoning {
  margin-bottom: 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  padding: 6px 10px;
  font-size: 12px;
  color: var(--fg-muted);
}
.reasoning > summary {
  cursor: pointer;
  list-style: none;
  user-select: none;
}
.reasoning > summary::-webkit-details-marker { display: none; }
.reasoning-body {
  margin-top: 6px;
  color: var(--fg-subtle);
  /* 走 markdown 渲染，不用 pre-wrap（pre-wrap 会与 <p><ul> 标签产生多余空白） */
}

/* 错误态 */
.error-box {
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--danger) 12%, transparent);
  color: var(--danger);
  font-size: 12px;
}

.export-footer {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--fg-subtle);
  text-align: center;
}
</style>
</head>
<body>
<div class="export-shell">
  <div class="export-header">
    <h1>{{TITLE}}</h1>
    <div class="export-sub">{{SUBTITLE}}</div>
  </div>
  <div class="export-messages">
{{MESSAGES}}
  </div>
  <div class="export-footer">会话结束</div>
</div>
</body>
</html>

[package]
name = "ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# ── PDF（决策 5：pdfium-render + 预编译 PDFium 动态库） ──
# 纯 Rust 生态（lopdf/pdfsink-rs）对中文 CIDFontType2 + ToUnicode CMap 解码失败，
# 实测输出乱码/空。pdfium 是 Chrome 内核，CJK 零乱码。
# - pdfium-render：纯 FFI 绑定（MIT/Apache-2.0），不编译 C++ 源码
# - PDFium 动态库：bblanchon/pdfium-binaries 预编译（BSD-3-Clause），随 Tauri 资源打包
# 关键：pdfium_7881 feature 必须与下载的 PDFium 版本严格一致，否则 bind() 崩溃
# thread_safe：Pdfium 实现 Send+Sync（可跨线程共享借用）
#   ⚠️ 注意：thread_safe 不串行化 FFI 调用！pdfium-render 0.9.3 native 路径无锁
#   （见决策 5），并发调 PDFium 会崩溃。本项目用进程级 Mutex 串行化
#   （ingest::with_pdfium，见 src/pdfium.rs）
pdfium-render = { version = "0.9.3", default-features = false, features = ["thread_safe", "pdfium_7881"] }

# ── Office（决策 4） ──
# office_oxide：DOCX 读/写 + PPTX + 老格式 DOC/XLS/PPT（统一 IR）
# XLSX 读用 calamine（类型/公式保真）。
# 注：XLSX 写功能未实现时暂移除 rust_xlsxwriter，实现时加回 `rust_xlsxwriter = "0.96"`。
office_oxide = "0.1.8"
calamine = "0.36"

# ── eBook（决策 6） ──
# rbook：Apache-2.0，ePub 2/3（否决 GPL 的 epub crate）
rbook = "0.7"

# ── 图片（多模态输入，决策 7 一期） ──
# 解码 → base64 → Rig Message（交 VLM 理解）
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "bmp",
    "gif",
] }
base64 = "0.23"

# ── 文本结构化 ──
csv = "1.4"
pulldown-cmark = "0.13"
serde_json.workspace = true

# ── 压缩包（递归 + 深度限制 + 流式，§六 security.rs 防 zip 炸弹） ──
# ARCHITECTURE.md 写 zip = "8"，但 crates.io 实测 8.x 已下架，最新 9.0.0-pre2。
zip = "9.0.0-pre2"
tar = "0.4"
# gzip 解压（tar.gz）；bz2/xz 一期不启用
flate2 = "1.0"

# ── 通用（workspace 统一版本） ──
serde.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
# ── 并行（PDF/大文档逐页提取加速） ──
# MIT/Apache-2.0，纯 Rust，无运行时依赖（符合原则 1/3）
rayon = "1"

[dev-dependencies]
zip = "9.0.0-pre2"
flate2 = "1.0"
